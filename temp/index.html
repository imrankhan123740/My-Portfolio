<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>All Templates</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: white;
            color: #171717;
            font-family: Arial, sans-serif;
            overflow-x: hidden;
        }

        .layout {
            display: flex;
            gap: 35px;
            max-width: 1550px;
            margin: auto;
            padding: 45px 30px;
        }

        .sidebar {
            width: 230px;
            flex-shrink: 0;
            position: sticky;
            top: 20px;
            height: calc(100vh - 40px);
            overflow-y: auto;
            background: white;
        }

        .side-title {
            color: gray;
            font-size: 13px;
            font-weight: bold;
            margin: 25px 0 10px;
        }

        .side-btn {
            width: 100%;
            display: block;
            border: none;
            background: white;
            text-align: left;
            padding: 10px;
            border-radius: 8px;
            transition: 0.2s;
        }

        .side-btn:hover {
            background: #f2f2f2;
            transform: translateX(3px);
        }

        .side-btn.active {
            background: #ededed;
            font-weight: bold;
        }

        .side-sub {
            margin-left: 15px;
            padding-left: 8px;
            border-left: 1px solid #eee;
        }

        .main {
            flex: 1;
            min-width: 0;
        }

        .main-heading {
            font-family: monospace;
            font-size: 78px;
            font-weight: bold;
        }

        .tagline {
            font-size: 20px;
            color: #555;
        }

        .search-box {
            height: 55px;
            border-radius: 18px;
            padding: 12px 20px;
            margin-top: 35px;
        }

        .search-box:focus {
            border-color: gray;
            box-shadow: 0 0 0 4px #f1f1f1;
        }

        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 22px 0;
        }

        .chip {
            border: 1px solid #ddd;
            background: white;
            border-radius: 25px;
            padding: 8px 18px;
        }

        .chip:hover, .chip.active {
            background: #222;
            color: white;
        }

        .section-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin: 40px 0 22px;
        }

        .section-head h2 {
            font-size: 25px;
            font-weight: bold;
        }

        .see-all {
            border: none;
            background: none;
                    }

        .template-card {
            border: 1px solid #eee;
            border-radius: 13px;
            overflow: hidden;
            height: 100%;
            transition: 0.25s;
        }

        .template-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 14px 35px rgba(0, 0, 0, 0.1);
        }

        .template-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .card-info {
            padding: 20px;
        }

        .card-info h3 {
            font-size: 19px;
            font-weight: bold;
            min-height: 53px;
        }

        .card-info p {
            color: #666;
            font-size: 14px;
            min-height: 70px;
        }

        .preview-btn {
            border: none;
            background: none;
          
            text-decoration: underline;
            color: blue;
        }

        .small-label, .result-count {
            color: gray;
            font-size: 13px;
        }

        .mobile-bar {
            display: none;
        }

        .empty {
            display: none;
            text-align: center;
            padding: 70px 10px;
            color: gray;
        }

        .modal-preview {
            width: 100%;
            max-height: 320px;
            object-fit: cover;
            border-radius: 10px;
        }

        .footer {
            border-top: 1px solid #eee;
            margin-top: 70px;
            padding: 25px 0;
            color: gray;
        }

        @media (max-width: 900px) {
            .layout {
                gap: 20px;
                padding: 25px 18px;
            }

            .sidebar {
                width: 185px;
            }

            .main-heading {
                font-size: 55px;
            }
        }

        @media (max-width: 767px) {
            .layout {
                display: block;
                padding: 15px;
            }

            .mobile-bar {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 15px;
            }

            .sidebar {
                display: none;
                position: static;
                width: 100%;
                height: auto;
                max-height: 65vh;
                border: 1px solid #eee;
                border-radius: 12px;
                padding: 12px;
                margin-bottom: 20px;
            }

            .sidebar.open {
                display: block;
            }

            .main-heading {
                font-size: 42px;
                text-align: center;
            }

            .tagline {
                text-align: center;
                font-size: 16px;
            }

            .section-head h2 {
                font-size: 20px;
            }

            .card-info h3, .card-info p {
                min-height: 0;
            }
        }
    </style>
</head>
<body>
    <div class="layout">
        <div class="mobile-bar">
            <strong>All templates</strong>
            <button class="btn btn-outline-dark btn-sm" id="menuToggle">☰ Categories</button>
        </div>

        <div class="sidebar" id="sidebar">
            <div class="side-title">Roles</div>
            <button class="side-btn" data-category="Sales">Sales</button>
            <button class="side-btn" data-category="Product">Product</button>
            <button class="side-btn" data-category="Marketing">Marketing</button>
            <button class="side-btn" data-category="Human resources">Human resources</button>
            <button class="side-btn" data-category="Customer success">Customer success</button>

            <div class="side-title">Goals</div>
            <button class="side-btn" data-category="Feedback">Get feedback</button>
            <button class="side-btn" data-category="Sales">Make sales</button>
            <button class="side-btn" data-category="Events">Plan events</button>
            <button class="side-btn" data-category="Research">Conduct research</button>
            <button class="side-btn" data-category="Marketing">Engage audience</button>
            <button class="side-btn" data-category="Human resources">Recruit talent</button>
            <button class="side-btn" data-category="Sales">Generate leads</button>

            <div class="side-title">Form type</div>
            <button class="side-btn" data-category="Forms">Forms</button>
            <div class="side-sub">
                <button class="side-btn" data-category="Events">Event registration forms</button>
                <button class="side-btn" data-category="Feedback">Feedback forms</button>
                <button class="side-btn" data-category="Booking">Booking forms</button>
                <button class="side-btn" data-category="Human resources">Employment forms</button>
                <button class="side-btn" data-category="Forms">See all forms</button>
            </div>

            <button class="side-btn" data-category="Surveys">Surveys</button>
            <div class="side-sub">
                <button class="side-btn" data-category="Marketing">Marketing surveys</button>
                <button class="side-btn" data-category="Product">Product surveys</button>
                <button class="side-btn" data-category="Research">Business surveys</button>
                <button class="side-btn" data-category="Surveys">See all surveys</button>
            </div>

            <button class="side-btn" data-category="Quizzes">Quizzes</button>
            <div class="side-sub">
                <button class="side-btn" data-category="Product">Product quizzes</button>
                <button class="side-btn" data-category="Marketing">Marketing quizzes</button>
                <button class="side-btn" data-category="Quizzes">See all quizzes</button>
            </div>

            <button class="side-btn" data-category="Polls">Polls</button>
        </div>

        <main class="main">
            <h1 class="main-heading">All templates</h1>
            <p class="tagline">Get inspired. Pick a template. Make it your own.</p>

            <input type="search" id="search" class="form-control search-box" placeholder="Search all templates and categories">

            <div class="chips">
                <button class="chip active" data-category="All">All templates</button>
                <button class="chip" data-category="Forms">Forms</button>
                <button class="chip" data-category="Surveys">Surveys</button>
                <button class="chip" data-category="Quizzes">Quizzes</button>
                <button class="chip" data-category="Polls">Polls</button>
            </div>

            <p class="result-count" id="resultCount"></p>
            <div id="gallery"></div>
            <div class="empty" id="empty">No templates found. Try another search or category.</div>

            <footer class="footer"></footer>
        </main>
    </div>

    <div class="modal fade" id="previewModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="previewTitle">Template preview</h5>
                    <button class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <img id="previewImage" class="modal-preview" alt="Template preview">
                    <p class="mt-3" id="previewText"></p>
                    <small class="text-muted" id="previewType"></small>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-outline-dark" data-bs-dismiss="modal">Close</button>
                    <button class="btn btn-dark" data-bs-dismiss="modal">Looks good</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let images = [
            'https://img.freepik.com/free-psd/restaurant-landing-page-template_23-2148466849.jpg?ga=GA1.1.1273103243.1726979524&semt=ais_hybrid&w=740',
            'https://tse1.mm.bing.net/th/id/OIP.-URL08sVPymp6Lgl6vF3GgHaDh?pid=Api&P=0&h=180',
            'https://tse3.mm.bing.net/th/id/OIP.bLueKXvrKoY4-N0Lx04erAHaDt?pid=Api&P=0&h=180',
            'https://tse3.mm.bing.net/th/id/OIP.CpU4-nlviGfH1eEWiEEWqwHaEK?pid=Api&P=0&h=180',
            'https://tse4.mm.bing.net/th/id/OIP.K77HOo8f37eYuFADl1F1KQHaEH?pid=Api&P=0&h=180',
            'https://tse3.mm.bing.net/th/id/OIP.gWNEVnhZKw4ZYl4ZkudXXQHaEK?pid=Api&P=0&h=180',
            'https://tse4.mm.bing.net/th/id/OIP.2y5q599EVepyTI71hKRIIwHaEK?pid=Api&P=0&h=180',
            'https://tse2.mm.bing.net/th/id/OIP.IPrHjOgxDE-VFDcLmSoG_wHaEG?pid=Api&P=0&h=180',
            'https://tse3.mm.bing.net/th/id/OIP.AOsajlBGmh64I69XGPESzgHaD_?pid=Api&P=0&h=180',
            'https://tse1.mm.bing.net/th/id/OIP.OqEh7-fnsmxxVThYXJow4wHaD2?pid=Api&P=0&h=180'
        ];

        let templates = [
            { title: 'Product recommendation quiz template', group: 'Product recommendation forms', type: 'Quizzes', tags: 'Product Sales', desc: 'Help customers discover products with a personalized shopping quiz.' },
            { title: 'Product feedback form', group: 'Product recommendation forms', type: 'Forms', tags: 'Product Feedback', desc: 'Collect useful feedback from customers about your products.' },
            { title: 'Customer preference survey', group: 'Product recommendation forms', type: 'Surveys', tags: 'Customer success Research', desc: 'Learn what your customers like and improve their experience.' },
            { title: 'Event registration form', group: 'Event & booking forms', type: 'Forms', tags: 'Events Marketing', desc: 'Let guests register for events quickly and easily.' },
            { title: 'Appointment booking form', group: 'Event & booking forms', type: 'Forms', tags: 'Booking Customer success', desc: 'Organize appointments and booking requests in one place.' },
            { title: 'Event feedback survey', group: 'Event & booking forms', type: 'Surveys', tags: 'Events Feedback', desc: 'Find out what attendees enjoyed about your event.' },
            { title: 'Marketing survey template', group: 'Surveys & feedback', type: 'Surveys', tags: 'Marketing Research', desc: 'Understand your audience and make better marketing decisions.' },
            { title: 'Employee satisfaction survey', group: 'Surveys & feedback', type: 'Surveys', tags: 'Human resources Feedback', desc: 'Gather honest feedback from your team.' },
            { title: 'Quick audience poll', group: 'Surveys & feedback', type: 'Polls', tags: 'Marketing Research', desc: 'Ask a quick question and discover what your audience thinks.' },
            { title: 'Lead generation quiz', group: 'Quizzes & lead generation', type: 'Quizzes', tags: 'Sales Marketing', desc: 'Engage visitors with a quiz and capture potential leads.' }
        ];

        for (let i = 0; i < templates.length; i++) {
            templates[i].image = images[i];
        }

        let selectedCategory = 'All';

        function selectCategory(category) {
            selectedCategory = category;

            let buttons = document.querySelectorAll('[data-category]');
            for (let btn of buttons) {
                btn.classList.remove('active');
                if (btn.dataset.category === category) {
                    btn.classList.add('active');
                }
            }

            renderTemplates();

            if (window.innerWidth < 768) {
                document.querySelector('#sidebar').classList.remove('open');
            }
        }

        function renderTemplates() {
            let search = document.querySelector('#search').value.toLowerCase().trim();
            let filtered = [];

            for (let item of templates) {
                let categoryMatch = selectedCategory === 'All' || item.type === selectedCategory || item.tags.toLowerCase().includes(selectedCategory.toLowerCase());
                let text = (item.title + ' ' + item.group + ' ' + item.type + ' ' + item.tags + ' ' + item.desc).toLowerCase();
                let searchMatch = text.includes(search);

                if (categoryMatch && searchMatch) {
                    filtered.push(item);
                }
            }

            document.querySelector('#resultCount').innerText = filtered.length + ' templates found';
            document.querySelector('#empty').style.display = filtered.length === 0 ? 'block' : 'none';

            let groups = [];
            for (let item of filtered) {
                if (!groups.includes(item.group)) {
                    groups.push(item.group);
                }
            }

            let html = '';

            for (let group of groups) {
                html += `<section>
                    <div class="section-head">
                        <h2>${group}</h2>
                        <button class="see-all" onclick="seeAll('${group}')">See all →</button>
                    </div>
                    <div class="row g-4">`;

                for (let item of filtered) {
                    if (item.group === group) {
                        let index = templates.indexOf(item);
                        html += `<div class="col-sm-6 col-lg-4">
                            <div class="template-card">
                                <img src="${item.image}" alt="${item.title}" loading="lazy">
                                <div class="card-info">
                                    <div class="small-label">${item.type}</div>
                                    <h3>${item.title}</h3>
                                    <p>${item.desc}</p>
                                    <button class="preview-btn" onclick="previewTemplate(${index})">View template →</button>
                                </div>
                            </div>
                        </div>`;
                    }
                }

                html += '</div></section>';
            }

            document.querySelector('#gallery').innerHTML = html;
        }

        function previewTemplate(index) {
            let item = templates[index];

            document.querySelector('#previewTitle').innerText = item.title;
            document.querySelector('#previewImage').src = item.image;
            document.querySelector('#previewText').innerText = item.desc;
            document.querySelector('#previewType').innerText = item.type + ' · ' + item.group;

            let modal = new bootstrap.Modal(document.querySelector('#previewModal'));
            modal.show();
        }

        function seeAll(group) {
            document.querySelector('#search').value = group;
            selectCategory('All');
        }

        let categoryButtons = document.querySelectorAll('[data-category]');
        for (let btn of categoryButtons) {
            btn.addEventListener('click', function () {
                selectCategory(this.dataset.category);
            });
        }

        document.querySelector('#search').addEventListener('input', function () {
            renderTemplates();
        });

        document.querySelector('#menuToggle').addEventListener('click', function () {
            document.querySelector('#sidebar').classList.toggle('open');
        });

        renderTemplates();
    </script>
</body>
</html>
